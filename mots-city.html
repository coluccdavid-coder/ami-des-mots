<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Mots City — l’anglais en rigolant</title>
<link rel="icon" href="img/icone.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1430;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
#jeu{position:fixed;inset:0}
#jeu canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer}
.verre{background:rgba(25,16,48,.72);border:1px solid rgba(255,255,255,.22);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
#haut{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
#haut>*{pointer-events:auto}
#retour{min-width:48px;height:48px;font-size:1.4rem;font-weight:900}
#compteurs{padding:8px 12px;font-weight:900;line-height:1.35;font-size:.95rem}
#fun{color:#ffd45c;letter-spacing:2px}
#fun .vide{opacity:.25}
#mission{flex:1;max-width:520px;margin:0 auto;padding:10px 14px;font-weight:800;font-size:.98rem;line-height:1.3}
#mission small{display:block;opacity:.75;font-weight:600}
#lettres-cible{font-size:1.4rem;letter-spacing:6px;font-family:ui-monospace,monospace;font-weight:900;color:#ffd45c}
#carte{width:132px;height:132px;padding:0;overflow:hidden;position:relative}
#carte canvas{width:100%;height:100%;display:block}
#heure{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:.72rem;font-weight:900;text-shadow:0 1px 3px #000}
#bulle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:min(94vw,560px);padding:14px 16px;z-index:6;display:none}
#bulle.vue{display:block;animation:arrive .25s ease-out}
#bulle .qui{font-size:.85rem;opacity:.8;font-weight:800}
#bulle .anglais{font-size:1.35rem;font-weight:1000;margin:4px 0;color:#fff}
#bulle .francais{font-size:.95rem;opacity:.85}
#bulle .vanne{font-size:1.1rem;font-weight:900;color:#ffd0dc;margin:4px 0}
#bulle .correction{font-size:1rem;font-weight:900;color:#9ff5d2}
#bulle .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#bulle .actions button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-weight:800}
#bulle.ko{border-color:rgba(255,120,150,.7)}
#bulle.ok{border-color:rgba(120,255,200,.7)}
#bulle img{width:56px;height:56px;border-radius:12px;float:right;margin-left:10px;background:#fff}
#etiquette{position:fixed;left:12px;top:calc(150px + env(safe-area-inset-top));z-index:6;padding:8px 12px;border:0;border-radius:14px;font:800 .95rem system-ui,sans-serif;color:inherit;cursor:pointer;max-width:60vw}
#toast{position:fixed;top:calc(150px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:10px 16px;font-weight:900;z-index:7;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.vu{opacity:1}
#toast small{display:block;font-weight:600;opacity:.8}
#monter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));padding:12px 20px;font-weight:1000;font-size:1.1rem;z-index:6;display:none;border-color:rgba(255,212,92,.8)}
#monter.vu{display:block}
#station{position:fixed;left:12px;bottom:calc(100px + env(safe-area-inset-bottom));padding:8px 12px;font-weight:900;font-size:.85rem;z-index:5;display:none}
#station.vu{display:block}
#outils{position:fixed;right:10px;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:5}
#outils button{width:52px;height:52px;font-size:1.45rem}
#outils button[hidden]{display:none}
#commandes{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 12px;z-index:5;pointer-events:none}
#commandes .groupe{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
#commandes button{width:74px;height:74px;font-size:2rem;font-weight:900;touch-action:none}
#commandes button.petit{width:56px;height:56px;font-size:1.4rem}
#commandes button.appuye,#commandes button.actif{background:rgba(255,212,92,.45)}
#panneau{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(10,6,22,.55)}
#panneau.vu{display:flex}
#panneau .boite{width:min(94vw,540px);max-height:88vh;overflow:auto;padding:18px}
#panneau h2{margin:0 0 6px}
#panneau .carte-mission{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
#panneau .carte-mission b{display:block;font-size:1.05rem}
#panneau .carte-mission span.ico{font-size:2rem}
#panneau .fermer{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);font-weight:900}
#panneau .jouer{background:linear-gradient(90deg,#ff6f91,#ff9671,#ffc75f);color:#2a0d1f;font-size:1.2rem;border:0}
#panneau p{line-height:1.45}
.titre-jeu{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:1000;letter-spacing:-1px;line-height:.95;margin:4px 0 6px;font-style:italic;
  background:linear-gradient(180deg,#fff7c2 0%,#ffc75f 40%,#ff6f91 75%,#c34a9f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0d3f)}
.sous-titre{font-weight:800;opacity:.85;margin:0 0 10px}
.tenues{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tenues button{padding:10px 4px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-size:.78rem;font-weight:800}
.tenues button.choisie{border-color:#ffd45c;background:rgba(255,212,92,.18)}
.tenues i{display:block;height:26px;border-radius:8px;margin-bottom:6px}
#chargement{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#1b1430;z-index:20;font-weight:900;font-size:1.2rem;text-align:center;padding:20px}
#chargement.cache{display:none}
@keyframes arrive{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
@media(pointer:fine){#commandes{display:none}#outils{bottom:20px}#bulle{bottom:24px}#monter{bottom:90px}#station{bottom:20px}}
@media(max-width:600px){#haut{flex-wrap:wrap}#mission{order:5;flex-basis:100%;font-size:.88rem;padding:8px 12px}#carte{width:92px;height:92px;margin-left:auto}#compteurs{font-size:.85rem}#outils button{width:44px;height:44px;font-size:1.2rem}#outils{bottom:calc(110px + env(safe-area-inset-bottom))}#commandes button{width:66px;height:66px}#commandes button.petit{width:50px;height:50px}#bulle{bottom:calc(96px + env(safe-area-inset-bottom))}#toast{top:calc(170px + env(safe-area-inset-top))}#monter{bottom:calc(90px + env(safe-area-inset-bottom))}#station{bottom:calc(170px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){#bulle.vue{animation:none}}
</style>
</head>
<body>
<div id="jeu" aria-label="Mots City, une ville en 3D"></div>
<div id="chargement" role="status">🌴 Mots City<br><small>La ville se réveille…</small></div>

<div id="haut">
  <button id="retour" class="verre" aria-label="Retour">←</button>
  <div id="compteurs" class="verre"><div>🪶 <span id="plumes">0</span> · ✨ <span id="dorees">0</span></div><div id="fun" aria-label="Niveau de rigolade"></div></div>
  <div id="mission" class="verre" aria-live="polite"></div>
  <div id="carte" class="verre"><canvas id="mini" width="200" height="200" aria-label="Plan de la ville"></canvas><div id="heure"></div></div>
</div>

<div id="bulle" class="verre" role="status" aria-live="polite"></div>
<div id="toast" class="verre" aria-live="polite"></div>
<button id="etiquette" class="verre" type="button" hidden aria-live="polite"></button>
<button id="monter" class="verre">🚪 Monter</button>
<div id="station" class="verre" aria-live="polite"></div>

<div id="outils">
  <button id="b-tel" class="verre" aria-label="Téléphone : missions (touche M)">📱</button>
  <button id="b-klaxon" class="verre" aria-label="Klaxon (touche H)" hidden>📯</button>
  <button id="b-radio" class="verre" aria-label="Changer de radio (touche R)">📻</button>
  <button id="b-son" class="verre" aria-label="Couper le son">🔊</button>
  <button id="b-aide" class="verre" aria-label="Aide">❔</button>
</div>

<div id="commandes" aria-label="Commandes tactiles">
  <div class="groupe"><button class="verre" data-dir="gauche" aria-label="Tourner à gauche">◀</button><button class="verre" data-dir="droite" aria-label="Tourner à droite">▶</button></div>
  <div class="groupe"><button class="verre petit" id="t-courir" aria-label="Courir">🏃</button><button class="verre petit" data-dir="saut" aria-label="Sauter">⤒</button><button class="verre" data-dir="bas" aria-label="Reculer / freiner">▼</button><button class="verre" data-dir="haut" aria-label="Avancer">▲</button></div>
</div>

<div id="panneau" role="dialog" aria-modal="true"><div class="boite verre" id="panneau-contenu"></div></div>

<script src="js/config-site.js"></script>
<script>/* Mots City caché pour l’instant (js/config-site.js, MOTS_CITY_CACHE). */try{if(window.CONFIG_JEU&&CONFIG_JEU.MOTS_CITY_CACHE&&!navigator.webdriver&&!/[?&]voir=1/.test(location.search))location.replace("index.html?aller=classique")}catch(e){}</script>

<script type="module">
import * as THREE from 'three';
import { chargerKit, chargerHabitants, HABITANTS, objetVehicule, perso, animerKit, geste, fusionner, objet, ambiance, texBruit, texVagues, texFacadeVerre } from './js/kit3d.js';
const C = window.MotsCity, MOTS = window.MOTS;
const $ = s => document.querySelector(s);
const sobre = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tactile = matchMedia('(pointer: coarse)').matches;
const save = C.charger();
// Modèles 3D KayKit (CC0). Sans eux, le jeu garde son décor dessiné par le code.
const KIT = await chargerKit((n, t) => { const s = document.querySelector('#chargement small'); if(s) s.textContent = 'Chargement des modèles 3D… ' + n + '/' + t; });
// Passants et tenues Quaternius (CC0) : une foule variée (chefs, médecins, ouvriers, mamies…). Sur téléphone, moins de modèles.
const FOULE = HABITANTS.filter(n => !/Knight|Viking/.test(n)).filter((n, i) => !tactile || i % 2 === 0);
const HAB = KIT ? await chargerHabitants(KIT, FOULE.concat(C.TENUES.map(t => t.perso).filter(p => /^q:/.test(p)).map(p => p.slice(2)))) : [];
const FOULE_OK = HAB.filter(n => FOULE.includes(n));

// ═══ Rendu ═══════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias:!tactile, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, tactile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;

$('#jeu').appendChild(renderer.domElement);

const ciel = document.createElement('canvas'); ciel.width = 2; ciel.height = 256;
const texCiel = new THREE.CanvasTexture(ciel); texCiel.colorSpace = THREE.SRGBColorSpace; scene.background = texCiel;
scene.fog = new THREE.Fog(0xffc9a0, 80, 230);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 500);
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x7a5a40, 1.6); scene.add(hemi);
// Graphismes : « haute » sur ordinateur (lueur des néons, reflets du ciel), « rapide » sur téléphone. Modifiable dans le téléphone.
// v5.67 : trois niveaux — Rapide, Haute, Ultra (occlusion, rayons de soleil, étalonnage cinéma, poussières dorées).
// Le réglage « Graphismes » du jeu décide d'abord ; en Auto, Ultra sur les appareils puissants.
const GFX = window.GRAPHISMES;
let qualiteCity = (() => { const g = GFX ? GFX.choix() : 'auto'; let l = null; try{ l = localStorage.getItem('motscity_qualite'); }catch(e){}
  if(g === 'ultra') return 'ultra'; if(g === 'normal') return l === 'rapide' ? 'rapide' : (l === 'haute' ? 'haute' : (tactile ? 'rapide' : 'haute'));
  return ['rapide', 'haute', 'ultra'].includes(l) ? l : (GFX && GFX.estUltra() ? 'ultra' : (tactile ? 'rapide' : 'haute')); })();
let qualiteHaute = qualiteCity !== 'rapide';
const amb = ambiance(renderer, scene, camera, { haute:qualiteHaute });
if(qualiteCity === 'ultra'){ amb.niveau('ultra'); renderer.setPixelRatio(Math.min(devicePixelRatio, tactile ? 1.75 : 2.25)); }
const soleil = new THREE.DirectionalLight(0xffe2bf, 2.6);
soleil.castShadow = true; soleil.shadow.mapSize.set(qualiteCity === 'ultra' && !tactile ? 4096 : 2048, qualiteCity === 'ultra' && !tactile ? 4096 : 2048);
Object.assign(soleil.shadow.camera, { left:-60, right:60, top:60, bottom:-60, near:10, far:260 });
soleil.shadow.bias = -0.0004; scene.add(soleil); scene.add(soleil.target);

const matCache = {};
const mat = (c, r = .8, m = 0) => matCache[c + ':' + r + ':' + m] || (matCache[c + ':' + r + ':' + m] = new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m }));
// Matériaux lumineux : leur éclat suit la nuit (mis à jour une fois par image, pas par objet).
const lumineux = [];
function neon(c, base = .25){ const m = new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:base, roughness:.4 }); m.userData.base = base; lumineux.push(m); return m; }
const geoBox = new THREE.BoxGeometry(1, 1, 1);
function boite(parent, x, y, z, w, h, d, m, ombre = true){
  const o = new THREE.Mesh(geoBox, m); o.scale.set(w, h, d); o.position.set(x, y, z);
  o.castShadow = ombre && !tactile; o.receiveShadow = !tactile; parent.add(o); return o;
}
const loader = new THREE.TextureLoader(), texPicto = {};
function picto(e){ if(!texPicto[e]){ const t = loader.load('img/pictos/' + MOTS[e].img + '.webp'); t.colorSpace = THREE.SRGBColorSpace; texPicto[e] = t; } return texPicto[e]; }
function etiquette(texte, fond = 'rgba(25,16,48,.85)', taille = 64){
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = '900 ' + taille + 'px system-ui, sans-serif';
  const w = Math.ceil(g.measureText(texte).width) + taille; c.width = w; c.height = taille * 1.6;
  g.font = '900 ' + taille + 'px system-ui, sans-serif'; g.fillStyle = fond;
  g.beginPath(); g.roundRect ? g.roundRect(0, 0, w, c.height, taille * .5) : g.rect(0, 0, w, c.height); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(texte, w / 2, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, depthTest:false, transparent:true }));
  s.scale.set(w / c.height * 1.2, 1.2, 1); s.renderOrder = 10; return s;
}
function panneauPicto(e, taille = 3){ const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:picto(e), transparent:true })); s.scale.set(taille, taille, 1); return s; }
// Halo lumineux (pour les lampadaires) : un dégradé radial partagé.
const texHalo = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const d = g.createRadialGradient(32, 32, 0, 32, 32, 32); d.addColorStop(0, 'rgba(255,230,170,1)'); d.addColorStop(.4, 'rgba(255,200,120,.45)'); d.addColorStop(1, 'rgba(255,180,100,0)'); g.fillStyle = d; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();

// ═══ La ville ═════════════════════════════════════════════════════
const PAS = 34, N = 5, LIMITE = 92;
const centre = i => (i - 2) * PAS;
const murs = [], solides = [];
// Le sol s'arrête à la plage : sinon l'herbe ressortait dans le creux des vagues.
const sol = new THREE.Mesh(new THREE.PlaneGeometry(700, 350 + LIMITE + 20), new THREE.MeshStandardMaterial({ map:texBruit(0x79c26a, .22, 128, 90), roughness:1 })); sol.position.z = (-350 + LIMITE + 20) / 2; sol.rotation.x = -Math.PI / 2; sol.receiveShadow = !tactile; scene.add(sol);
const route = new THREE.MeshStandardMaterial({ map:texBruit(0x7d8396, .16, 128, 30), roughness:.88 }), ligne = mat(0xffe08a, .6), trottoir = new THREE.MeshStandardMaterial({ map:texBruit(0xe6dccb, .12, 64, 4), roughness:.9 });
const tirets = [];
for(let k = 0; k <= N; k++){
  const p = centre(k) - PAS / 2;
  boite(scene, p, .02, 0, 10, .04, 2 * LIMITE + 10, route, false);
  boite(scene, 0, .021, p, 2 * LIMITE + 10, .04, 10, route, false);
  for(let q = -LIMITE; q < LIMITE; q += 6) tirets.push([p, q, .3, 2.6], [q, p, 2.6, .3]);
}
function instances(geo, m, liste, ombre){
  const im = new THREE.InstancedMesh(geo, m, liste.length), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  liste.forEach((it, i) => { e.set(it.rx || 0, it.ry || 0, it.rz || 0, 'YXZ'); q.setFromEuler(e); im.setMatrixAt(i, m4.compose(new THREE.Vector3(it.x, it.y, it.z), q, new THREE.Vector3(it.sx || 1, it.sy || 1, it.sz || 1))); });

}
instances(geoBox, ligne, tirets.map(([x, z, w, d]) => ({ x, y:.05, z, sx:w, sy:.02, sz:d })));

// Plage, promenade, ponton, mer.
boite(scene, 0, .03, LIMITE + 16, 300, .06, 26, new THREE.MeshStandardMaterial({ map:texBruit(0xf3dc9b, .14, 128, 40), roughness:1 }), false);
boite(scene, 0, .1, LIMITE + 5.5, 200, .2, 4, mat(0xc79a6b, .9), false);   // promenade en bois
const mer = new THREE.Mesh(new THREE.PlaneGeometry(500, 160, tactile ? 30 : 80, tactile ? 10 : 24), new THREE.MeshStandardMaterial({ color:0x1f9fc7, roughness:.12, metalness:.25, normalMap:texVagues(), normalScale:new THREE.Vector2(.6, .6) }));
mer.rotation.x = -Math.PI / 2; mer.position.set(0, .05, LIMITE + 108); scene.add(mer);
const merBase = mer.geometry.attributes.position.array.slice();
// Ponton avec une grande roue
const ponton = { x:10, z1:LIMITE + 22, z2:LIMITE + 70 };
boite(scene, ponton.x, .9, (ponton.z1 + ponton.z2) / 2, 8, .4, ponton.z2 - ponton.z1, mat(0xa47551, .9));
for(let z = ponton.z1; z < ponton.z2; z += 6) for(const dx of [-3.6, 3.6]) boite(scene, ponton.x + dx, .4, z, .4, 1.6, .4, mat(0x6b4a33));
const roue = new THREE.Group(); roue.position.set(ponton.x, 12, ponton.z2 - 8); scene.add(roue);
{
  const anneau = new THREE.Mesh(new THREE.TorusGeometry(9, .25, 8, 48), neon(0xff4fa3, .35)); roue.add(anneau);
  const anneau2 = anneau.clone(); anneau2.position.z = 1.2; roue.add(anneau2);
  for(let k = 0; k < 12; k++){ const a = k / 12 * Math.PI * 2;
    const r = boite(roue, Math.cos(a) * 4.5, Math.sin(a) * 4.5, .6, 9, .12, .12, mat(0xffffff)); r.rotation.z = a;
    const n = new THREE.Group(); n.position.set(Math.cos(a) * 9, Math.sin(a) * 9, .6); roue.add(n);
    boite(n, 0, -1, 0, 1.4, 1.2, 1.2, mat([0x00c2d1, 0xffc75f, 0xff6f91, 0x8338ec][k % 4], .5)); n.userData.nacelle = true; }
  boite(scene, ponton.x - 2.5, 6, ponton.z2 - 8, .5, 12, .5, mat(0xdddddd)); boite(scene, ponton.x + 2.5, 6, ponton.z2 - 8, .5, 12, .5, mat(0xdddddd));
  murs.push({ x1:ponton.x - 3, x2:ponton.x + 3, z1:ponton.z2 - 9, z2:ponton.z2 - 7 });
}
const nacelles = roue.children.filter(o => o.userData.nacelle);

// Immeubles « art déco » pastel : fenêtres qui s'allument la nuit, néons sur les toits.
function texFenetres(allumees){
  const c = document.createElement('canvas'); c.width = 64; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = allumees ? '#000' : '#fff'; g.fillRect(0, 0, 64, 128);

  bulle('<div class="qui">' + esc(qui) + '</div><div class="anglais">' + esc(anglais) + '</div><div class="francais">' + esc(francais) + '</div>' +
    '<div class="actions"><button data-b="redire">🔊 Réécouter</button><button data-b="lent">🐢 Lentement</button><button data-b="ok">✓ Compris</button></div>');
  parler(anglais);
}
$('#bulle').addEventListener('click', ev => { const b = ev.target.closest('button'); if(!b) return;
  if(b.dataset.b === 'redire') parler(dernierePhrase); else if(b.dataset.b === 'lent') parler(dernierePhrase, true); else fermerBulle(); });
function fun(d){ save.fun = Math.max(0, Math.min(5, save.fun + d)); majCompteurs(); C.garder(save); }
function majOutils(){ $('#b-klaxon').hidden = !conduite; $('#t-courir').hidden = !!conduite; $('[data-dir="saut"]').hidden = !!conduite; if(!conduite){ $('#station').classList.remove('vu'); } }
const confettis = [];
function feuDArtifice(x, y, z){
  if(sobre) return;
  for(let k = 0; k < 40; k++){ const o = new THREE.Mesh(geoBox, mat(PASTELS[k % PASTELS.length], .5)); o.scale.setScalar(.25); o.position.set(x, y, z); scene.add(o);
    confettis.push({ o, vx:(Math.random() - .5) * 10, vy:6 + Math.random() * 6, vz:(Math.random() - .5) * 10, t:1.6 }); }
}

// ═══ Missions ════════════════════════════════════════════════════
let mission = null;
function pointClient(){
  const c = ctrl();
  for(let k = 0; k < 50; k++){
    const t = trottoirs[Math.floor(Math.random() * trottoirs.length)], [x, z] = surTour(t, Math.random() * 92);
    const dx = x - t.x, dz = z - t.z, px = x + Math.sign(dx) * (Math.abs(dx) > Math.abs(dz) ? 2.5 : 0), pz = z + Math.sign(dz) * (Math.abs(dz) >= Math.abs(dx) ? 2.5 : 0);
    if(Math.hypot(px - c.x, pz - c.z) > 30 && !murs.some(m => px > m.x1 - 1 && px < m.x2 + 1 && pz > m.z1 - 1 && pz < m.z2 + 1)) return [px, pz];
  }
  return [centre(1) + 14.5, centre(3)];
}
function poserCible(x, z){ anneau.position.set(x, .3, z); anneau.visible = true; porteFleche.visible = true; mission.cible = [x, z]; }
function nettoyer(){ viderLettres(); for(const e of etals){ e.e = null; e.sprite.visible = false; } anneau.visible = false; porteFleche.visible = false; client.visible = false; passagerFig.visible = false; scene.add(passagerFig); }
function lancer(type){
  fermerPanneau(); nettoyer();
  mission = type === 'livraison' ? C.livraison() : type === 'taxi' ? C.taxi(null) : C.lettres();
  if(type === 'lettres'){ semerLettres(); majMission(); return; }
  const [x, z] = pointClient(); poserCible(x, z);
  client.position.set(x, 0, z); client.visible = true;
  majMission();
  toast(type === 'livraison' ? '🛍️ A customer is waiting!' : '🚕 A passenger is waiting!', type === 'taxi' && !conduite ? 'Prends d’abord un véhicule (E près d’un scooter ou d’une voiture).' : 'Suis la flèche verte.');
}
function majMission(){
  const m = $('#mission');
  if(!mission){ m.innerHTML = '📱 Ouvre ton téléphone (M) pour une mission !<small>Ou balade-toi : ✨ ' + (dorees.length - save.dorees.length) + ' plumes dorées sont cachées en ville.</small>'; return; }
  if(mission.type === 'lettres'){
    m.innerHTML = '🔤 Attrape les lettres dans l’ordre : <img src="img/pictos/' + MOTS[mission.voulu].img + '.webp" alt="" width="28" height="28" style="vertical-align:middle;border-radius:6px"><br><span id="lettres-cible">' +
      mission.mot.split('').map((c, i) => i < mission.pris.length ? c : '_').join(' ') + '</span>'; return;
  }
  const quoi = mission.type === 'livraison' ? '🛍️ Livraison' : '🚕 Taxi';
  const texte = { client:mission.type === 'taxi' && !conduite ? 'Prends un véhicule, puis va chercher le passager.' : 'Va voir le client (flèche verte).',
    marche:'Va au marché et passe sous le bon étal !', retour:'Rapporte la commande au client.', route:'Emmène le passager au bon endroit (regarde le plan) !', monte:'Remonte dans ton véhicule (E).' }[mission.etape];
  m.innerHTML = quoi + ' — ' + esc(texte) + (mission.etape !== 'client' ? '<small>« ' + esc(mission.phrase) + ' »</small>' : '');
}
function viderLettres(){ for(const l of lettresVolantes) scene.remove(l.s); lettresVolantes = []; }
function semerLettres(){
  viderLettres();
  const toutes = mission.mot.split('').concat(mission.leurres), c = ctrl(), places = [];
  for(let k = 0; k <= N; k++) for(let q = 0; q < N; q++){ const p = centre(k) - PAS / 2, r = centre(q); places.push([p, r], [r, p]); }
  const libres = C.melange(places).filter(([x, z]) => Math.hypot(x - c.x, z - c.z) > 12 && Math.hypot(x - c.x, z - c.z) < 95);
  toutes.forEach((ch, i) => { const [x, z] = libres[i % libres.length]; const s = etiquette(ch, 'rgba(157,77,255,.95)', 96); s.scale.multiplyScalar(2.1); s.position.set(x, 2.4, z); scene.add(s); lettresVolantes.push({ s, c:ch, x, z }); });
}
function reussir(texte, correction, x, z){
  sons.ok(); feuDArtifice(x, 2, z); if(!conduite) geste(heros, 'Cheer'); geste(client, 'Cheer');
  const plumes = 3 + save.fun; save.plumes += plumes; save.reussies[mission.type]++;
  if(mission.voulu && !save.appris.includes(mission.voulu)) save.appris.push(mission.voulu);
  fun(+1);
  bulle('<div class="anglais">🎉 ' + esc(texte) + '</div><div class="correction">✅ ' + esc(correction) + '</div><div class="francais">+' + plumes + ' 🪶 · Niveau de rigolade ' + save.fun + '/5</div><div class="actions"><button data-b="ok">Super !</button></div>', 'ok', 6000);
  if(mission.voulu) parler(C.en(mission.voulu));
  mission = null; nettoyer();
  $('#mission').innerHTML = '🎉 Mission réussie ! <small>📱 Touche le téléphone (ou M) pour la suivante.</small>'; C.garder(save);
}
function rater(r){ sons.ko(); fun(-1);
  bulle('<div class="vanne">😂 ' + esc(r.vanne) + '</div><div class="correction">✅ ' + esc(r.correction) + '</div><div class="actions"><button data-b="ok">J’ai compris, je réessaie</button></div>', 'ko'); }
function verifierMission(){
  const c = ctrl(), d = (x, z) => Math.hypot(c.x - x, c.z - z);
  // Plumes dorées
  for(const p of dorees) if(p.o.visible && d(p.x, p.z) < (conduite ? 2.8 : 1.9)){
    p.o.visible = false; save.dorees.push(p.i); sons.doree(); if(!conduite) geste(heros, 'PickUp', .9); const e = C.PLUMES_DOREES[p.i];
    if(!save.appris.includes(e)) save.appris.push(e); save.plumes += 5; C.garder(save); majCompteurs();
    bulle('<img src="img/pictos/' + MOTS[e].img + '.webp" alt=""><div class="qui">✨ Plume dorée ' + save.dorees.length + '/' + dorees.length + ' — nouveau mot !</div><div class="anglais">' + esc(C.en(e)) + '</div><div class="francais">= ' + esc(C.fr(e)) + ' · +5 🪶</div><div class="actions"><button data-b="redire">🔊 Réécouter</button><button data-b="ok">✓</button></div>', 'ok', 7000);
    dernierePhrase = C.en(e); parler(C.en(e)); majMission();
  }
  if(!mission) return;
  if(mission.type === 'lettres'){
    for(const l of lettresVolantes) if(!l.pris && d(l.x, l.z) < 2.8 && c.y < 2.5){
      const r = C.juger(mission, l.c);
      if(r.juste){ l.pris = true; scene.remove(l.s); sons.lettre(); majMission();
        if(r.fini){ viderLettres(); const m = mission; reussir('Well spelled: ' + m.mot + '!', m.mot + ' = ' + C.fr(m.voulu), c.x, c.z); } }
      else{ l.pris = true; l.s.visible = false; setTimeout(() => { l.pris = false; l.s.visible = true; }, 2500); rater(r); }
    }
    return;
  }
  if(mission.etape === 'client' && d(...mission.cible) < 3.8){
    if(mission.type === 'livraison'){
      dialogue('🧑 Le client', mission.phrase, mission.sens + ' (regarde bien le mot anglais !)');
      mission.etape = 'marche'; mission.cible = [centre(2), centre(2)]; anneau.visible = false;
      etals.forEach((e, i) => { e.e = mission.etals[i]; e.sprite.material.map = picto(e.e); e.sprite.material.needsUpdate = true; e.sprite.visible = true; });
    }else{
      if(!conduite){ if(!mission.prevenu){ mission.prevenu = true; toast('I need a ride!', 'Il me faut un véhicule ! Va chercher un scooter ou une voiture.'); } return; }
      dialogue('🧑 Le passager', mission.phrase, mission.sens);
      client.visible = false; anneau.visible = false; porteFleche.visible = false;
      mission.cible = [lieux[mission.voulu].x, lieux[mission.voulu].z]; placerPassager();
    }
    majMission(); return;
  }
  if(mission.type === 'livraison' && mission.etape === 'marche'){
    for(const e of etals) if(d(e.x, e.z) < e.r){
      if(mission.dernierEtal === e.e) continue; mission.dernierEtal = e.e;
      const r = C.juger(mission, e.e);
      if(r.juste){ sons.lettre(); toast('Got it: ' + C.en(e.e) + '!', 'Je l’ai : ' + C.fr(e.e) + ' !'); mission.etape = 'retour'; poserCible(client.position.x, client.position.z); majMission(); }
      else rater(r);
    }
    if(!etals.some(e => d(e.x, e.z) < e.r)) mission.dernierEtal = null;
    return;
  }
  if(mission.type === 'livraison' && mission.etape === 'retour' && d(...mission.cible) < 3.8){
    const m = mission; reussir('Thank you so much!', C.en(m.voulu) + ' = ' + C.fr(m.voulu) + ' · « Thank you so much! » = Merci beaucoup !', c.x, c.z); return;
  }
  if(mission.type === 'taxi' && mission.etape === 'route'){
    for(const e in lieux){ const l = lieux[e]; if(d(l.x, l.z) < l.r){
      if(mission.dernierLieu === e) continue; mission.dernierLieu = e;
      const r = C.juger(mission, e);
      if(r.juste){ const m = mission; reussir('Here we are! Thanks, driver!', C.en(m.voulu) + ' = ' + C.fr(m.voulu) + ' · « Here we are! » = Nous y voilà !', l.x, l.z); return; }
      rater(r);
    } }
    if(!Object.values(lieux).some(l => d(l.x, l.z) < l.r)) mission.dernierLieu = null;
  }
}

// ═══ Physique ════════════════════════════════════════════════════
let boboT = 0, passantT = 0;
function collisions(e, rayon){
  let choc = false;
  for(const m of murs){
    const cx = Math.max(m.x1, Math.min(e.x, m.x2)), cz = Math.max(m.z1, Math.min(e.z, m.z2)), dx = e.x - cx, dz = e.z - cz, d = Math.hypot(dx, dz);
    if(d < rayon){
      if(d > 1e-4){ e.x = cx + dx / d * rayon; e.z = cz + dz / d * rayon; }
      else{ const g = [e.x - m.x1, m.x2 - e.x, e.z - m.z1, m.z2 - e.z], i = g.indexOf(Math.min(...g));
        if(i === 0) e.x = m.x1 - rayon; else if(i === 1) e.x = m.x2 + rayon; else if(i === 2) e.z = m.z1 - rayon; else e.z = m.z2 + rayon; }
      choc = true;
    }
  }
  const autres = voitures.map(v => ({ x:v.g.position.x, z:v.g.position.z, r:v.r || 2 })).concat(vehicules.filter(v => v !== e).map(v => ({ x:v.x, z:v.z, r:v.P.rayon })));
  for(const o of autres){ const dd = Math.hypot(e.x - o.x, e.z - o.z), lim = rayon + o.r; if(dd < lim && dd > 1e-4){ const k = (lim - dd) / dd; e.x += (e.x - o.x) * k; e.z += (e.z - o.z) * k; choc = true; } }
  e.x = Math.max(-LIMITE - 4, Math.min(LIMITE + 4, e.x));
  // La mer arrête tout le monde, sauf sur le ponton.
  const surPonton = e === pieton && Math.abs(e.x - ponton.x) < 3.6 && e.z < ponton.z2;   // à pied seulement
  e.z = Math.max(-LIMITE - 4, Math.min(surPonton ? ponton.z2 - 1 : LIMITE + 27, e.z));
  return choc;
}
function physiqueVehicule(v, dt){
  const P = v.P;
  if(entree.haut) v.v += P.acc * dt;
  else if(entree.bas) v.v -= (v.v > 0 ? P.frein : P.acc * .6) * dt;
  else v.v -= Math.sign(v.v) * Math.min(Math.abs(v.v), 5 * dt);
  v.v = Math.max(-6, Math.min(P.max, v.v));
  // Gauche = le nez part à gauche à l'écran (en avant comme en arrière).
  const vise = (entree.gauche ? 1 : 0) - (entree.droite ? 1 : 0);
  v.braquage += (vise - v.braquage) * Math.min(1, dt * 8);
  if(!v.enLair) v.h += v.braquage * P.tourne * Math.min(1, Math.abs(v.v) / 4 + .15) * dt;
  v.x += Math.sin(v.h) * v.v * dt; v.z += Math.cos(v.h) * v.v * dt;
  if(!v.enLair) for(const t of tremplins) if(Math.hypot(v.x - t.x, v.z - t.z) < 2.6 && v.v > 8){ v.enLair = true; v.vy = v.v * .5; toast('Wheee! 🚀', 'Youpiii !'); }
  if(v.enLair){ v.vy -= 22 * dt; v.y += v.vy * dt; if(v.y <= 0){ v.y = 0; v.enLair = false; if(v.vy < -8 && Math.random() < .5) fun(+1); v.vy = 0; } }
  if(collisions(v, P.rayon) && Math.abs(v.v) > 3){ v.v = -v.v * .25; if(performance.now() - boboT > 2500){ boboT = performance.now(); sons.boum(); const p = C.phrase('bobos'); toast(p.en, p.fr); } }
}
function physiquePieton(dt){
  const e = pieton, vmax = courir ? 8 : 4.2;
  const cible = entree.haut ? vmax : entree.bas ? -2.2 : 0;
  e.v += (cible - e.v) * Math.min(1, dt * 10);
  const vise = (entree.gauche ? 1 : 0) - (entree.droite ? 1 : 0);
  e.h += vise * 3 * dt;
  e.x += Math.sin(e.h) * e.v * dt; e.z += Math.cos(e.h) * e.v * dt;
  if(entree.saut && !e.enLair){ e.enLair = true; e.vy = 7.5; }
  if(e.enLair){ e.vy -= 22 * dt; e.y += e.vy * dt; if(e.y <= 0){ e.y = 0; e.enLair = false; e.vy = 0; } }
  collisions(e, .45);
  // Monter sur le ponton : on est un peu plus haut.
  const surPonton = Math.abs(e.x - ponton.x) < 4 && e.z > ponton.z1 - 1;
  if(!e.enLair) e.y = surPonton ? 1.1 : 0;
}

// ═══ Caméra ══════════════════════════════════════════════════════
const ray = new THREE.Raycaster(), camVise = new THREE.Vector3(), camPos = new THREE.Vector3(-17, 6, 72), regard = new THREE.Vector3();
function majCamera(dt){
  const c = ctrl(), P = conduite ? conduite.P : { cam:6, camH:3.2 };
  if(!glisse && (Math.abs(c.v) > .5)) camDecal *= Math.pow(.2, dt);
  const a = c.h + camDecal, fx = Math.sin(a), fz = Math.cos(a), dist = P.cam + Math.max(0, c.v) * .1;
  const tete = new THREE.Vector3(c.x, (conduite ? 2 : 1.6) + c.y, c.z);
  camVise.set(c.x - fx * dist, P.camH + c.y * .6, c.z - fz * dist);
  const dir = camVise.clone().sub(tete), l = dir.length(); dir.normalize();
  ray.set(tete, dir); ray.far = l;
  const hit = ray.intersectObjects(solides, false)[0];
  if(hit) camVise.copy(tete).addScaledVector(dir, Math.max(1.5, hit.distance - .6));
  camPos.lerp(camVise, Math.min(1, dt * 5)); camera.position.copy(camPos);
  regard.set(c.x + Math.sin(c.h) * 3, (conduite ? 1.6 : 1.4) + c.y, c.z + Math.cos(c.h) * 3); camera.lookAt(regard);
}

// ═══ Jour et nuit ════════════════════════════════════════════════
// Une journée dure 6 minutes. On commence à l'heure dorée (17 h 30).
let heure = 17.5;
const PALETTES = [ // [heure, haut du ciel, horizon, brouillard, intensité soleil, intensité ciel, nuit 0..1]
  [0, '#0b1030', '#2a1b4a', 0x1a1838, .3, .7, 1], [5, '#141a45', '#5b3a6e', 0x3a2c58, .35, .75, .9], [6.5, '#6a7fd8', '#ffb38a', 0xffc9a0, 1.2, 1.1, .35],
  [9, '#4b8fe0', '#bfe3ff', 0xcfe7ff, 2.6, 1.6, 0], [16, '#4b7bd8', '#ffd9a8', 0xffd9b0, 2.4, 1.5, 0], [18.5, '#5a4fb8', '#ff8a5c', 0xff9f80, 1.3, 1.1, .35],
  [20, '#1c1d55', '#a3477a', 0x5a3260, .45, .8, .85], [24, '#0b1030', '#2a1b4a', 0x1a1838, .3, .7, 1]];
const cA = new THREE.Color(), cB = new THREE.Color(), cTmp = new THREE.Color();
let nuit = 0, dernierCiel = -1;
function majJour(dt){
  heure = (heure + dt * 24 / 360) % 24;
  let i = 0; while(i < PALETTES.length - 2 && heure >= PALETTES[i + 1][0]) i++;
  const A = PALETTES[i], B = PALETTES[i + 1], f = (heure - A[0]) / (B[0] - A[0]);
  nuit = A[6] + (B[6] - A[6]) * f;
  soleil.intensity = A[4] + (B[4] - A[4]) * f; hemi.intensity = A[5] + (B[5] - A[5]) * f;
  scene.fog.color.copy(cA.setHex(A[3]).lerp(cB.setHex(B[3]), f));
  const ang = (heure - 6) / 12 * Math.PI;   // le soleil traverse le ciel de 6 h à 18 h
  const c = ctrl();
  const dir = amb.soleil(Math.sin(ang) * 62, 205 + (heure - 12) * 9, nuit);
  if(dir.y > .08) soleil.position.set(c.x + dir.x * 120, dir.y * 120, c.z + dir.z * 120);
  else soleil.position.set(c.x - Math.cos(ang) * 80, 14, c.z + 40);   // la nuit : lumière de lune, venue d'en haut
  soleil.target.position.set(c.x, 0, c.z);
  soleil.color.copy(cTmp.setHex(0xffe2bf).lerp(cB.setHex(0xff9a6b), Math.min(1, nuit * 1.5)));
  if(Math.abs(heure - dernierCiel) > .05){
    dernierCiel = heure; const g = ciel.getContext('2d'), d = g.createLinearGradient(0, 0, 0, 256);
    d.addColorStop(0, '#' + cA.set(A[1]).lerp(cB.set(B[1]), f).getHexString()); d.addColorStop(.62, '#' + cA.set(A[2]).lerp(cB.set(B[2]), f).getHexString());
    d.addColorStop(1, '#' + cA.set(A[2]).lerp(cB.set(B[2]), f).getHexString()); g.fillStyle = d; g.fillRect(0, 0, 2, 256); texCiel.needsUpdate = true;
    $('#heure').textContent = (nuit > .5 ? '🌙 ' : '☀️ ') + String(Math.floor(heure)).padStart(2, '0') + ':' + String(Math.floor(heure % 1 * 60)).padStart(2, '0');
  }
  for(const m of lumineux) m.emissiveIntensity = m.userData.base + nuit * 1.8;
  for(const m of fenetresNuit) m.emissiveIntensity = nuit * 1.1;
  halos.material.opacity = Math.max(0, nuit - .2) * .8;
  if(KIT && KIT.matVille) KIT.matVille.emissiveIntensity = Math.max(0, nuit - .3) * .38;
  phareNuit.intensity = conduite ? nuit * 60 : 0;
  mer.material.normalMap.offset.set(temps * .012, temps * .007);
  if(conduite){ phareNuit.position.set(c.x + Math.sin(c.h) * 2, 1.2, c.z + Math.cos(c.h) * 2); phareNuit.target.position.set(c.x + Math.sin(c.h) * 20, 0, c.z + Math.cos(c.h) * 20); }
}

// ═══ Plan ════════════════════════════════════════════════════════
const mini = $('#mini').getContext('2d');
const echelle = 200 / (2 * LIMITE + 40), mx = x => (x + LIMITE + 15) * echelle, mz = z => (z + LIMITE + 15) * echelle;
const imgsPlan = {};
function dessinerPlan(t){
  const g = mini; g.clearRect(0, 0, 200, 200);
  g.fillStyle = '#7cc46a'; g.fillRect(0, 0, 200, 200);
  g.fillStyle = '#3fb6d9'; g.fillRect(0, mz(LIMITE + 29), 200, 200);
  g.fillStyle = '#f3dc9b'; g.fillRect(0, mz(LIMITE + 3), 200, mz(LIMITE + 29) - mz(LIMITE + 3));
  g.fillStyle = '#a47551'; g.fillRect(mx(ponton.x - 4), mz(ponton.z1), 8 * echelle, (ponton.z2 - ponton.z1) * echelle);
  g.strokeStyle = '#4a4f63'; g.lineWidth = 10 * echelle;
  for(let k = 0; k <= N; k++){ const p = centre(k) - PAS / 2; g.beginPath(); g.moveTo(mx(p), mz(-LIMITE)); g.lineTo(mx(p), mz(LIMITE)); g.stroke(); g.beginPath(); g.moveTo(mx(-LIMITE), mz(p)); g.lineTo(mx(LIMITE), mz(p)); g.stroke(); }
  for(const e in lieux){ const l = lieux[e]; let im = imgsPlan[e]; if(!im){ im = imgsPlan[e] = new Image(); im.src = 'img/pictos/' + MOTS[e].img + '.webp'; }
    if(im.complete && im.naturalWidth) g.drawImage(im, mx(l.x) - 9, mz(l.z) - 9, 18, 18); }
  g.font = '900 13px system-ui'; g.textAlign = 'center'; g.fillText('🛒', mx(0), mz(0) + 5);
  for(const v of vehicules) if(v !== conduite){ g.fillStyle = '#ffd45c'; g.fillRect(mx(v.x) - 2.5, mz(v.z) - 2.5, 5, 5); }
  if(mission && mission.cible && (porteFleche.visible || mission.etape === 'client')){ g.fillStyle = 'rgba(61,252,154,' + (.5 + .5 * Math.sin(t * 6)) + ')'; g.beginPath(); g.arc(mx(mission.cible[0]), mz(mission.cible[1]), 7, 0, 7); g.fill(); }
  for(const l of lettresVolantes) if(!l.pris){ g.fillStyle = '#9d4dff'; g.fillRect(mx(l.x) - 3, mz(l.z) - 3, 6, 6); }
  const c = ctrl(); g.save(); g.translate(mx(c.x), mz(c.z)); g.rotate(-c.h + Math.PI);
  g.fillStyle = '#fff'; g.strokeStyle = '#ff2e88'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, -8); g.lineTo(6, 6); g.lineTo(-6, 6); g.closePath(); g.fill(); g.stroke(); g.restore();
}

// ═══ Boucle ══════════════════════════════════════════════════════
let avant = performance.now(), temps = 0;
// Étiquettes : quand on passe près d'une chose, son nom anglais s'affiche (on touche pour l'entendre).
const NOMS_VEHICULES = { NormalCar1:['car', 'la voiture'], Taxi:['taxi', 'le taxi'], Bus:['bus', 'le bus'], SUV:['car', 'la voiture'], SchoolBus:['school bus', 'le bus scolaire'], Ambulance:['ambulance', 'l’ambulance'], kaykit:['car', 'la voiture'] };
const vusE = new Set((() => { try{ return JSON.parse(localStorage.getItem('city_etiquettes') || '[]'); }catch(e){ return []; } })());
let etiqProche = null, tEtiq = 0;
function chosesProches(x, z){
  const l = [];
  for(const e in lieux) l.push({ x:lieux[e].x, z:lieux[e].z, en:C.en(e), fr:C.fr(e), r:13 });
  for(const n of nature) if(/^PalmTree/.test(n.nom)) l.push({ x:n.x, z:n.z, en:'palm tree', fr:'le palmier', r:2.6 });
  for(const n of palmiers) l.push({ x:n.x, z:n.z, en:'palm tree', fr:'le palmier', r:2.6 });
  for(const v of voitures){ const [en, fr] = NOMS_VEHICULES[v.nom] || NOMS_VEHICULES.kaykit; l.push({ x:v.g.position.x, z:v.g.position.z, en, fr, r:5.5 }); }
  let best = null, dm = Infinity;
  for(const c of l){ const d = Math.hypot(x - c.x, z - c.z); if(d < c.r && d / c.r < dm){ dm = d / c.r; best = c; } }
  return best;
}
function majEtiquette(dt){
  tEtiq += dt; if(tEtiq < .3) return; tEtiq = 0;
  const p = conduite ? conduite : pieton, best = chosesProches(p.x, p.z), b = $('#etiquette');
  if((best && best.en) === (etiqProche && etiqProche.en)){ etiqProche = best; return; }
  etiqProche = best;
  if(!best){ b.hidden = true; return; }
  b.hidden = false; b.textContent = '🏷️ ' + best.en + ' · ' + best.fr + ' 🔊';
  if(!vusE.has(best.en)){ vusE.add(best.en); try{ localStorage.setItem('city_etiquettes', JSON.stringify([...vusE])); }catch(e){} toast('New word: ' + best.en + '!', 'Nouveau mot : ' + best.fr + ' (' + vusE.size + ' trouvés)'); }
}
$('#etiquette').onclick = () => { if(etiqProche){ dernierePhrase = etiqProche.en; parler(etiqProche.en); } };
function boucle(maintenant){
  const dt = Math.min(.05, (maintenant - avant) / 1000); avant = maintenant; temps += dt; perf = temps;
  if(!panneauOuvert){ if(conduite) physiqueVehicule(conduite, dt); else physiquePieton(dt); }
  majJour(dt); radioTic(); majEtiquette(dt);
  if(conduite && STATIONS[station].parle && !panneauOuvert){ parleT += dt; if(parleT > 25){ parleT = 0; radioParle(); } }
  // Véhicules
  for(const v of vehicules){
    v.g.position.set(v.x, v.y, v.z); v.g.rotation.y = v.h;
    v.g.rotation.z = v.type === 'scooter' ? -v.braquage * .22 * Math.min(1, Math.abs(v.v) / 8) : 0;
    v.g.rotation.x = v.enLair ? -.12 : 0;
    v.roues.forEach(r => r.rotation.x += v.v * dt / v.P.roues);
  }
  // Héros
  if(conduite){ animer(heros, 0, dt, 'assis'); }
  else{ heros.position.set(pieton.x, pieton.y, pieton.z); heros.rotation.y = pieton.h; animer(heros, pieton.v, dt, pieton.enLair ? 'air' : null); }
  if(passagerFig.visible) animer(passagerFig, 0, dt, 'assis');
  // Bouton « monter »
  const proche = !conduite && vehiculeProche(), bm = $('#monter');
  bm.classList.toggle('vu', !panneauOuvert && (!!proche || (!!conduite && Math.abs(conduite.v) < 4)));
  bm.textContent = conduite ? '🚪 Descendre (E)' : proche ? (proche.type === 'scooter' ? '🛵 Monter sur le scooter (E)' : '🚗 Monter dans la voiture (E)') : '';
  if(moteur && audio){ const c = conduite; moteur.o.frequency.value = 50 + Math.abs(c ? c.v : 0) * (c && c.type === 'cabriolet' ? 6 : 9); moteur.g.gain.value = sonActif && c ? .012 + Math.abs(c.v) * .0015 : 0; }
  // Flèche GPS
  const c = ctrl();
  if(porteFleche.visible && mission && mission.cible){ porteFleche.position.set(c.x, (conduite ? 4 : 3.2) + c.y + (sobre ? 0 : Math.sin(temps * 4) * .2), c.z); porteFleche.rotation.y = Math.atan2(mission.cible[0] - c.x, mission.cible[1] - c.z); }
  if(anneau.visible){ anneau.rotation.z += dt; anneau.scale.setScalar(1 + (sobre ? 0 : Math.sin(temps * 5) * .05)); }
  if(client.visible){ client.lookAt(c.x, 0, c.z); animer(client, 0, dt); if(client.userData.bras) client.userData.bras[1].rotation.x = -2.6 + Math.sin(temps * 8) * .4; }
  // Passants : ils marchent (vraies jambes), et sautent de côté si on arrive trop vite.
  for(const q of passants){
    const pres = Math.hypot(q.p.position.x - c.x, q.p.position.z - c.z);
    if(pres < 4 && Math.abs(c.v) > 5 && q.calme <= 0){ q.saut = .6; q.calme = 4; geste(q.p, Math.random() < .5 ? 'Dodge_Left' : 'Dodge_Right'); if(performance.now() - passantT > 3000){ passantT = performance.now(); const ph = C.phrase('passants'); toast('🗣️ ' + ph.en, ph.fr); } }
    q.calme -= dt;
    const marche = q.saut > 0 ? 0 : q.v; q.s += marche * dt;
    const [x, z, cote] = surTour(q.t, q.s); q.p.position.set(x, 0, z);
    q.p.rotation.y = [Math.PI / 2, 0, -Math.PI / 2, Math.PI][cote];
    if(q.saut > 0){ q.saut -= dt; if(q.p.userData.kit) animer(q.p, 0, dt); else { q.p.position.y = Math.sin((1 - q.saut / .6) * Math.PI) * 1.1; animer(q.p, 0, dt, 'air'); } }
    else animer(q.p, marche, dt);
  }
  // Circulation
  for(const v of voitures){
    const [x, z, h] = surCarre(v.coins, v.s, 2.6 * v.sens), fx = Math.sin(h) * v.sens, fz = Math.cos(h) * v.sens, dx = c.x - x, dz = c.z - z;
    const devant = dx * fx + dz * fz, cote = Math.abs(dx * fz - dz * fx), bloque = devant > 0 && devant < 7 + v.r && cote < 2.4;
    v.v += ((bloque ? 0 : v.vmax) - v.v) * Math.min(1, dt * 4); v.s += v.v * v.sens * dt;
    v.g.position.set(x, 0, z); v.g.rotation.y = h + (v.sens < 0 ? Math.PI : 0); v.roues.forEach(r => r.rotation.x += v.v * dt / .48);
  }
  // Décor vivant
  if(!sobre){
    roue.rotation.z += dt * .12; for(const n of nacelles) n.rotation.z = -roue.rotation.z;
    if(!tactile || temps % .1 < dt){ const p = mer.geometry.attributes.position; for(let i = 0; i < p.count; i++){ const x = merBase[i * 3], y = merBase[i * 3 + 1]; p.array[i * 3 + 2] = Math.sin(x * .08 + temps * 1.4) * .35 + Math.cos(y * .11 + temps) * .25; } p.needsUpdate = true; }
    if(lieux['⛵'].bateau) lieux['⛵'].bateau.rotation.z = Math.sin(temps * 1.1) * .05;
  }
  for(const p of dorees) if(p.o.visible){ p.o.rotation.y += dt * 2; p.o.position.y += Math.sin(temps * 3 + p.x) * .004; }
  for(const l of lettresVolantes) l.s.position.y = 2.4 + (sobre ? 0 : Math.sin(temps * 3 + l.x) * .3);
  for(let i = confettis.length - 1; i >= 0; i--){ const k = confettis[i]; k.vy -= 15 * dt; k.o.position.x += k.vx * dt; k.o.position.y += k.vy * dt; k.o.position.z += k.vz * dt; k.o.rotation.x += dt * 8; k.t -= dt; if(k.t <= 0){ scene.remove(k.o); confettis.splice(i, 1); } }
  verifierMission();
  majCamera(dt);
  amb.rendre();
  dessinerPlan(temps);
  requestAnimationFrame(boucle);
}
majCompteurs(); majMission(); majOutils();
$('#chargement').classList.add('cache');
requestAnimationFrame(t => { avant = t; boucle(t); });
ecranTitre();
// Accès pour les tests automatiques.
window.__city = { get etat(){ return ctrl(); }, pieton, entree, camera, lieux, etals, lancer, get mission(){ return mission; }, get conduite(){ return conduite; },
  nature, foule:FOULE_OK,
  get lettres(){ return lettresVolantes.map(l => ({ c:l.c, x:l.x, z:l.z, pris:!!l.pris })); }, get heros(){ return heros; }, chosesProches, get etiqProche(){ return etiqProche; }, murs, save, voitures, vehicules, passants, scene, renderer,
  monter, descendre, dorees:() => dorees.map(d => ({ i:d.i, x:d.x, z:d.z, vu:d.o.visible })), regler:h => { heure = h; dernierCiel = -1; }, get nuit(){ return nuit; } };
</script>
