# Publie le jeu sur GitHub Pages à chaque mise à jour de main (sans les outils, tests ni serveur PHP).
# Une fois : GitHub → Settings → Pages → Source : « GitHub Actions ».
name: Site GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run verifier
      - run: node outils/preparer-www.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploiement
        uses: actions/deploy-pages@v4
